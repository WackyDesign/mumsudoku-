<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16263a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mum Sudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Sudoku Logbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine Spalte, Kopfzeile mit Status, Gitter als Kartenblatt, darunter Werkzeuge und Ziffernblock */
:root{
  --bg:#eef2f4; --paper:#fbfcfd; --ink:#16263a; --muted:#5d6e80;
  --line:#c7d2dc; --line-strong:#16263a; --accent:#e0561f;
  --sel:#d6e6f5; --peer:#e7eef5; --same:#bcd5ec; --err:#c8322b; --err-bg:#fbe3e1;
  --given:#16263a; --user:#1f5fa8; --btn:#e3e9ee;
  --box:#16263a;
  --bronze:#b26a35; --silver:#7d8fa3; --gold:#c9961a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1621; --paper:#152131; --ink:#e4ebf2; --muted:#8fa1b4;
  --line:#2b3b50; --line-strong:#9db2c8; --accent:#ff7a3d;
  --sel:#23405f; --peer:#1b2b3e; --same:#2c5480; --err:#ff6b62; --err-bg:#4a2024;
  --given:#e4ebf2; --user:#7fb6f0; --btn:#1e2d40; --box:#e4ebf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1621; --paper:#152131; --ink:#e4ebf2; --muted:#8fa1b4;
  --line:#2b3b50; --line-strong:#9db2c8; --accent:#ff7a3d;
  --sel:#23405f; --peer:#1b2b3e; --same:#2c5480; --err:#ff6b62; --err-bg:#4a2024;
  --given:#e4ebf2; --user:#7fb6f0; --btn:#1e2d40; --box:#e4ebf2; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
.panel{display:flex;flex-direction:column;gap:12px;border-radius:16px;transition:background .4s,padding .4s}
/* Fotohintergrund */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg);pointer-events:none}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity 1.6s ease,transform 12s linear}
.bg img.on{opacity:1;transform:scale(1.12)}
body.has-bg{--a:var(--glass,55%);background:#000}
body.has-bg .panel{padding:12px;background:color-mix(in srgb,var(--paper) var(--a),transparent);
  -webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 6px 24px rgb(0 0 0/.25)}
body.has-bg .board{background:color-mix(in srgb,var(--paper) var(--a),transparent);box-shadow:0 8px 30px rgb(0 0 0/.3)}
body.has-bg .cell.peer{background:color-mix(in srgb,var(--peer) 35%,transparent)}
body.has-bg .cell{text-shadow:0 0 4px var(--paper),0 0 2px var(--paper)}
body.has-bg .cell.sel{background:color-mix(in srgb,var(--sel) 55%,transparent)}
body.has-bg .cell.same{background:transparent}
body.has-bg .pad button{background:color-mix(in srgb,var(--btn) 75%,transparent)}
body.has-bg .foot{display:none}
.glassrow{display:flex;align-items:center;gap:10px;padding:0 16px 14px;font-family:var(--mono);font-size:.8rem;color:#9fb0c2}
.glassrow input{flex:1;accent-color:var(--accent)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:1.7rem;font-weight:700;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.stats{display:flex;gap:14px;font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff button{flex:1;min-width:0;font:500 .82rem var(--display);padding:8px 4px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.diff button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.board-wrap{position:relative}
.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1;width:100%;max-width:100%;
  background:var(--paper);border:3.5px solid var(--box);border-radius:6px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:clamp(1.1rem,6vw,1.8rem);cursor:pointer;color:var(--user);font-variant-numeric:tabular-nums;transition:background .12s}
.cell:nth-child(9n){border-right:none}
.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:3.5px solid var(--box)}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3.5px solid var(--box)}
.cell:nth-child(n+73){border-bottom:none}
.cell.given{color:var(--given);font-weight:500}
.cell.peer{background:var(--peer)}
.cell.same:not(.err){color:var(--accent)!important;font-weight:700}
.cell.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
body.has-bg .cell.same.sel{background:color-mix(in srgb,var(--sel) 55%,transparent)}
.cell.err{color:var(--err);background:var(--err-bg)}
.cell.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(.5rem,2.2vw,.72rem);color:var(--muted)}
.notes span{display:flex;align-items:center;justify-content:center}
.notes span.hl{color:var(--accent);font-weight:700}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border:none;background:transparent;color:var(--ink);font:500 .75rem var(--display);cursor:pointer;border-radius:10px}
.tool svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.on{color:var(--accent)}
.tool .badge{font-family:var(--mono);font-size:.65rem;padding:1px 6px;border-radius:999px;background:var(--btn)}
.tool.on .badge{background:var(--accent);color:var(--paper)}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pad button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 6px;border:none;border-radius:10px;background:var(--btn);color:var(--user);font:500 clamp(1.2rem,5.5vw,1.6rem) var(--mono);cursor:pointer;min-width:0}
.pad button small{font-size:.6rem;color:var(--muted)}
.pad button.done{opacity:.3;pointer-events:none}
.pad.notemode button{color:var(--muted)}
button:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.96)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  background:color-mix(in srgb,var(--paper) 92%,transparent);border-radius:6px;padding:20px}
.overlay h2{margin:0;font-size:2rem;letter-spacing:-.02em}
.overlay p{margin:0;color:var(--muted);font-family:var(--mono);font-size:.9rem}
.primary{font:700 1rem var(--display);padding:12px 26px;border:none;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
.confirm{display:flex;gap:8px;justify-content:center}
.ghost{font:500 1rem var(--display);padding:12px 22px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.show{position:fixed;inset:0;z-index:50;background:#05090f;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);color:#e9eef4}
.show-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;font-family:var(--mono);font-size:.8rem}
.show-bar .grp{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{font:500 .85rem var(--display);padding:8px 14px;border-radius:999px;border:1px solid #33465c;background:#111c29;color:#e9eef4;cursor:pointer}
.sbtn.warn{border-color:#7a3530;color:#ff9a90}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.stage img{position:absolute;max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .8s ease}
.stage img.on{opacity:1}
.stage .nav{position:absolute;top:0;bottom:0;width:30%;border:none;background:transparent;cursor:pointer;color:transparent}
.stage .prev{left:0}.stage .next{right:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px;max-width:340px}
.empty p{margin:0;color:#9fb0c2;line-height:1.5}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 16px 16px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:#33465c}
.dots i.on{background:var(--accent)}
/* Belohnungen */
.rank{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;font:500 .85rem var(--display);text-align:left}
.rank svg{width:18px;height:18px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rname{white-space:nowrap}
.bar{flex:1;min-width:30px;height:6px;border-radius:99px;background:var(--btn);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .9s ease}
.pts{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.streak{font-family:var(--mono);font-size:.75rem;color:var(--accent);white-space:nowrap}
.overlay{overflow:auto;justify-content:safe center;gap:8px;padding:14px}
.overlay.win h2{font-size:1.6rem}
.big{font:500 2.1rem var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;max-width:240px;font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:left}
.breakdown span:nth-child(2n){text-align:right;color:var(--ink)}
.note{font-size:.82rem;font-weight:500;color:var(--ink)}
.newbadges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--btn);font-size:.76rem;font-weight:500}
.chip .medal{width:22px;height:22px}
.chip .medal svg{width:13px;height:13px}
.medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tier,var(--accent));font:500 .95rem var(--mono);flex:none}
.medal svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t-bronze{--tier:var(--bronze)}.t-silver{--tier:var(--silver)}.t-gold{--tier:var(--gold)}
.sheet{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{max-width:480px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.sheet h3{margin:0 0 10px;font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.rankcard{display:flex;flex-direction:column;gap:8px}
.rankcard .now{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.rankcard .sub{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.rankcard .bar{height:8px;flex:none}
.ladder{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.72rem;color:var(--muted)}
.ladder b{color:var(--accent);font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat b{display:block;font:500 1.35rem var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.76rem;font-weight:500}
.badge small{font-weight:400;color:var(--muted);font-size:.66rem;line-height:1.35}
.badge.locked .medal{background:var(--btn);color:var(--muted)}
.badge.locked>span{color:var(--muted)}
.rows{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px 12px;font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;align-items:baseline}
.rows .h{color:var(--muted);font-size:.68rem}
.rows .r{text-align:right}
.empty-log{color:var(--muted);font-size:.85rem;margin:0}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.rank{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px}
.rtxt{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.rank .bar{grid-column:1/-1;height:5px}
.rtxt .pts{white-space:normal;text-align:right}
/* Feiertagsrahmen */
#hfx{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.board-wrap[data-hol] .board{border-color:var(--h1);box-shadow:0 0 0 4px var(--h2),0 0 0 6px var(--h1),0 8px 30px rgb(0 0 0/.3)}
.hdeco{position:absolute;z-index:3;font-size:clamp(22px,7vw,32px);line-height:1;pointer-events:none;filter:drop-shadow(0 2px 3px rgb(0 0 0/.35))}
.hdeco.tl{top:-18px;left:-12px;transform:rotate(-12deg)}.hdeco.tr{top:-18px;right:-12px;transform:rotate(12deg)}
.hdeco.bl{bottom:-18px;left:-12px;transform:rotate(8deg)}.hdeco.br{bottom:-18px;right:-12px;transform:rotate(-8deg)}
.hlabel{position:absolute;z-index:3;top:0;left:50%;transform:translate(-50%,-62%);padding:4px 14px;border-radius:99px;background:var(--h1);color:#fff;
  font:700 .8rem var(--display);white-space:nowrap;box-shadow:0 0 0 2px var(--h2),0 4px 12px rgb(0 0 0/.3);pointer-events:none}
.wacki{position:fixed;z-index:60;left:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(44vw,190px);aspect-ratio:1;
  transform:translateX(-100%) rotate(-10deg);transform-origin:0 100%;transition:transform .9s cubic-bezier(.3,1.25,.5,1);pointer-events:none}
.wacki.right{left:auto;right:0;transform:translateX(100%) rotate(10deg);transform-origin:100% 100%}
.wacki.in{transform:translateX(-22%) rotate(6deg);pointer-events:auto;cursor:pointer}
.wacki.right.in{transform:translateX(22%) rotate(-6deg)}
.wacki img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .22s;filter:drop-shadow(0 6px 10px rgb(0 0 0/.35))}
.wacki.right img{transform:scaleX(-1)}
.wacki img.on{opacity:1}
.wbub{position:absolute;top:2%;right:-6%;padding:5px 12px;border-radius:14px;background:#fff;color:#16263a;font:700 1rem var(--display);
  box-shadow:0 4px 12px rgb(0 0 0/.25);opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.wacki.right .wbub{right:auto;left:-6%}
.wbub.on{opacity:1;transform:scale(1)}
.holsel{font:500 .85rem var(--display);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.cheer{position:fixed;z-index:65;left:50%;top:calc(env(safe-area-inset-top,0px) + 7%);transform:translate(-50%,0) scale(.6);opacity:0;pointer-events:none;
  padding:14px 24px;border-radius:20px;background:var(--accent);color:#fff;font:700 clamp(1.3rem,6vw,1.8rem) var(--display);letter-spacing:-.01em;
  width:max-content;max-width:calc(100vw - 32px);text-align:center;text-wrap:balance;box-shadow:0 12px 36px rgb(0 0 0/.35);transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.6,.4,1)}
.cheer.on{opacity:1;transform:translate(-50%,0) scale(1) rotate(-2deg)}
/* Fokus-Modus: nur das Spielfeld */
.iconbtn{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;align-self:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header .stats{align-items:center}
body.focus .app>.panel,body.focus .foot{display:none}
.app{min-height:100%;box-sizing:border-box}
body.focus .app{justify-content:center}
.fbar{position:fixed;z-index:6;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  padding:5px 5px 5px 14px;border-radius:99px;background:color-mix(in srgb,var(--paper) 72%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-family:var(--mono);font-size:.8rem;color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:0 4px 18px rgb(0 0 0/.25);white-space:nowrap}
.fbar button{font:500 .78rem var(--display);padding:6px 12px;border-radius:99px;border:none;background:var(--ink);color:var(--paper);cursor:pointer}
body:not(.focus) .fbar{display:none}
.fbar button.lite{background:transparent;color:var(--ink);border:1px solid var(--line)}
.fbar{gap:8px}
body:not(.has-bg) #focusBtn{display:none}
.picker{position:absolute;z-index:4;display:grid;grid-template-columns:repeat(3,48px);gap:5px;padding:7px;border-radius:16px;
  background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 12px 34px rgb(0 0 0/.35)}
.picker button{height:46px;border:none;border-radius:11px;background:var(--btn);color:var(--user);font:500 1.35rem var(--mono);cursor:pointer;padding:0}
.picker button.done{opacity:.25;pointer-events:none}
.picker.notemode .num{color:var(--muted);font-size:1rem}
.picker .fn{font:500 .7rem var(--display);color:var(--ink);height:36px;display:flex;align-items:center;justify-content:center;gap:4px}
.picker .fn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.picker .fn.on{background:var(--accent);color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;font:500 .64rem/1.3 var(--display);color:var(--muted);text-align:center;cursor:pointer;min-width:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.filled{padding:0;border:none}
.slot.sel{outline:3px solid var(--user);outline-offset:2px}
.slot .tag{position:absolute;left:4px;bottom:4px;background:var(--accent);color:#fff;font-size:.56rem;padding:2px 6px;border-radius:99px}
.slot.open{border:1.5px dashed var(--accent);color:var(--accent)}
.slot .plus{font:500 1.6rem var(--mono);line-height:1}
.slot.locked{cursor:default;background:var(--btn)}
.slot svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slot .bar{width:80%;flex:none;height:4px}
.slot .num{position:absolute;top:4px;left:6px;font:500 .6rem var(--mono)}
.slot.filled .num{color:#fff;text-shadow:0 1px 2px #000}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{flex:1}
.sm{padding:9px 14px!important;font-size:.85rem!important}
.ghost.warn{color:var(--err);border-color:var(--err)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.88rem;flex-wrap:wrap}
.setrow+.setrow{margin-top:12px}
.seg{display:flex;gap:4px}
.seg button{font:500 .78rem var(--mono);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.setrow input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}
.tracks{display:flex;flex-direction:column;gap:8px}
.track{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 .9rem var(--display);text-align:left;cursor:pointer;width:100%}
.track small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.track .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--ink);flex:none}
.track .ico svg{width:15px;height:15px;fill:currentColor;stroke:none}
.track[aria-pressed="true"]{border-color:var(--accent)}
.track[aria-pressed="true"] .ico{background:var(--accent);color:#fff}
.track.locked{cursor:default;color:var(--muted)}
.track.locked .ico svg{fill:none;stroke:currentColor;stroke-width:1.8}
.lockcard{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.85rem;line-height:1.4}
.lockcard svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.range{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:12px}
.range input{flex:1;min-width:0;accent-color:var(--accent)}
.hintp{margin:0;font-size:.78rem;color:var(--muted);line-height:1.45}
.note.hl{color:var(--accent);font-size:1rem}
.note.sub{color:var(--muted);font-weight:400;font-size:.78rem}
.foot{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.cell.pop{animation:none}*{transition:none!important}}
</style>

</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<canvas id="hfx" aria-hidden="true"></canvas>
<div class="app">
  <div class="panel">
  <header>
    <h1>Sudoku<span>.</span></h1>
    <div class="stats"><span>Fehler <b id="mist">0/3</b></span><span><b id="time">00:00</b></span><button class="iconbtn" id="focusBtn" aria-label="Fokus-Modus: nur das Spielfeld zeigen" title="Nur Spielfeld"><svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button></div>
  </header>
  <button class="rank" id="rankBtn" aria-label="Galerie öffnen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="6.5" y="7.5" width="11" height="9" rx="1"/></svg><span class="rtxt"><span class="rname" id="rName">Bilderrahmen 1 von 8</span><span class="pts" id="rPts"></span></span><span class="bar"><i id="rBar"></i></span></button>
  <div class="diff" role="group" aria-label="Schwierigkeit">
    <button data-d="leicht">Leicht</button>
    <button data-d="mittel">Mittel</button>
    <button data-d="schwer">Schwer</button>
    <button data-d="experte">Experte</button>
  </div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Sudoku-Gitter"></div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="picker" id="picker" hidden></div>
  </div>
  <div class="panel">
  <div class="tools">
    <button class="tool" id="undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Rückgängig</button>
    <button class="tool" id="erase"><svg viewBox="0 0 24 24"><path d="M20 20H8l-5-5 10-10 8 8-7 7"/><path d="m6 12 6 6"/></svg>Löschen</button>
    <button class="tool" id="notes"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="badge" id="noteBadge">AUS</span></button>
    <button class="tool" id="hint"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2Z"/></svg>Tipp <span class="badge" id="hintBadge">3</span></button>
    <button class="tool" id="photos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 8"/></svg>Galerie <span class="badge" id="galBadge">0/1</span></button>
  </div>
  <div class="pad" id="pad"></div>
  </div>
  <div class="fbar" id="fbar"><span id="fMist">0/3 Fehler</span><span id="fTime">00:00</span><button id="fGal" class="lite">Galerie</button><button id="fExit">Alles zeigen</button></div>
  <p class="foot">Tastatur: Pfeile, 1–9, Entf, N für Notizen</p>
</div>

<div class="sheet" id="gal" hidden role="dialog" aria-label="Galerie"><div class="sheet-in" id="galIn"></div></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Logbuch"><div class="sheet-in" id="sheetIn"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wacki" id="wacki" aria-hidden="true"></div>
<div class="cheer" id="cheer" role="status" aria-live="polite"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const CLUES={leicht:40,mittel:33,schwer:28,experte:24};
let S; // state
let timerId;

// ---------- Generator ----------
const peersOf=[...Array(81)].map((_,i)=>{const r=i/9|0,c=i%9,br=r-r%3,bc=c-c%3,s=new Set();
  for(let k=0;k<9;k++){s.add(r*9+k);s.add(k*9+c);s.add((br+(k/3|0))*9+bc+k%3)}s.delete(i);return[...s]});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ok=(g,i,v)=>peersOf[i].every(p=>g[p]!==v);
function fill(g){const i=g.indexOf(0);if(i<0)return true;
  for(const v of shuffle([1,2,3,4,5,6,7,8,9]))if(ok(g,i,v)){g[i]=v;if(fill(g))return true}g[i]=0;return false}
function count(g,lim=2){let best=-1,bc=10;
  for(let i=0;i<81;i++)if(!g[i]){let n=0;for(let v=1;v<=9;v++)if(ok(g,i,v))n++;if(n<bc){bc=n;best=i;if(!n)return 0}}
  if(best<0)return 1;let t=0;
  for(let v=1;v<=9&&t<lim;v++)if(ok(g,best,v)){g[best]=v;t+=count(g,lim-t);g[best]=0}return t}
function generate(d){const sol=Array(81).fill(0);fill(sol);const puz=sol.slice();let filled=81;
  for(const i of shuffle([...Array(81).keys()])){if(filled<=CLUES[d])break;const b=puz[i];puz[i]=0;
    if(count(puz.slice())!==1)puz[i]=b;else filled--}
  return{puz,sol}}

// ---------- Speichern ----------
const save=()=>{try{localStorage.setItem('sudoku-v1',JSON.stringify(S))}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem('sudoku-v1'))}catch(e){return null}};

function newGame(d){const{puz,sol}=generate(d);
  S={d,puz,sol,val:puz.slice(),notes:Array.from({length:81},()=>[]),sel:-1,mist:0,hints:3,time:0,hist:[],noteMode:false,over:null};
  start()}
function start(){clearInterval(timerId);timerId=setInterval(()=>{if(!S.over&&!document.hidden){S.time++;$('time').textContent=$('fTime').textContent=fmt(S.time);if(S.time%5===0)save()}},1000);
  $('overlay').hidden=true;render();save()}
const fmt=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');

// ---------- Render ----------
const board=$('board'),pad=$('pad');
for(let i=0;i<81;i++){const c=document.createElement('div');c.className='cell';c.role='gridcell';c.tabIndex=-1;c.onclick=()=>select(i);board.appendChild(c)}
for(let v=1;v<=9;v++){const b=document.createElement('button');b.innerHTML=v+'<small></small>';b.setAttribute('aria-label','Ziffer '+v);b.onclick=()=>input(v);pad.appendChild(b)}

function render(){const sv=S.sel>=0?S.val[S.sel]:0;const pr=S.sel>=0?new Set(peersOf[S.sel]):new Set();
  board.childNodes.forEach((el,i)=>{const v=S.val[i];
    el.className='cell'+(S.puz[i]?' given':'')+(pr.has(i)?' peer':'')+(sv&&v===sv?' same':'')+(i===S.sel?' sel':'')+(v&&!S.puz[i]&&v!==S.sol[i]?' err':'');
    if(v){el.textContent=v}else if(S.notes[i].length){el.innerHTML='<div class="notes">'+[1,2,3,4,5,6,7,8,9].map(n=>`<span class="${n===sv?'hl':''}">${S.notes[i].includes(n)?n:''}</span>`).join('')+'</div>'}else el.textContent='';
    el.setAttribute('aria-label',`Zeile ${(i/9|0)+1}, Spalte ${i%9+1}: ${v||'leer'}`)});
  const cnt=Array(10).fill(0);S.val.forEach((v,i)=>{if(v&&v===S.sol[i])cnt[v]++});
  pad.childNodes.forEach((b,k)=>{b.querySelector('small').textContent=9-cnt[k+1]||'';b.classList.toggle('done',cnt[k+1]===9)});
  pad.classList.toggle('notemode',S.noteMode);
  $('notes').classList.toggle('on',S.noteMode);$('noteBadge').textContent=S.noteMode?'AN':'AUS';
  $('hintBadge').textContent=S.hints;$('mist').textContent=S.mist+'/3';$('time').textContent=fmt(S.time);
  document.querySelectorAll('.diff button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===S.d));
  $('fMist').textContent=S.mist+'/3 Fehler';$('fTime').textContent=fmt(S.time);applyFocus();if(!$('picker').hidden)drawPicker()}

// ---------- Fokus-Modus ----------
const focusOn=()=>typeof P!=='undefined'&&P.focus!==false;
function applyFocus(){const f=focusOn()&&!S.over&&document.body.classList.contains('has-bg');document.body.classList.toggle('focus',f);if(!f)hidePicker()}
function hidePicker(){$('picker').hidden=true}
const PK_NOTE='<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const PK_DEL='<svg viewBox="0 0 24 24"><path d="M20 20H8l-5-5 10-10 8 8-7 7"/></svg>';
const PK_UNDO='<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>';
function drawPicker(){const pk=$('picker'),i=S.sel;
  if(i<0||S.puz[i]||S.val[i]===S.sol[i]){hidePicker();return}
  const cnt=Array(10).fill(0);S.val.forEach((v,j)=>{if(v&&v===S.sol[j])cnt[v]++});
  pk.classList.toggle('notemode',S.noteMode);
  pk.innerHTML=[1,2,3,4,5,6,7,8,9].map(v=>`<button class="num${cnt[v]===9?' done':''}" data-v="${v}" aria-label="${v} eintragen">${v}</button>`).join('')+
    `<button class="fn${S.noteMode?' on':''}" data-f="note">Notiz</button><button class="fn" data-f="del">Löschen</button><button class="fn" data-f="undo">Zurück</button>`}
function showPicker(i){const pk=$('picker'),wrap=pk.parentElement;drawPicker();if(pk.hidden&&(S.puz[i]||S.val[i]===S.sol[i]))return;pk.hidden=false;
  if(S.puz[i]||S.val[i]===S.sol[i]){hidePicker();return}
  const wr=wrap.getBoundingClientRect(),cr=board.childNodes[i].getBoundingClientRect(),pw=pk.offsetWidth,ph=pk.offsetHeight;
  let left=cr.left-wr.left+cr.width/2-pw/2;left=Math.max(0,Math.min(wr.width-pw,left));
  let top=cr.bottom-wr.top+6;if(cr.bottom+6+ph>innerHeight-76)top=cr.top-wr.top-ph-6;
  pk.style.left=left+'px';pk.style.top=Math.max(-wr.top+8,top)+'px'}
$('picker').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v){input(+b.dataset.v);if(!S.over&&S.sel>=0&&S.val[S.sel]===S.sol[S.sel])hidePicker();return}
  if(b.dataset.f==='note'){S.noteMode=!S.noteMode;render();save()}
  else if(b.dataset.f==='del')erase();
  else if(b.dataset.f==='undo')undo()});
document.addEventListener('pointerdown',e=>{if($('picker').hidden)return;if(e.target.closest('#picker,.cell'))return;hidePicker()});
$('focusBtn').onclick=()=>{P.focus=true;saveP();applyFocus()};
$('fGal').onclick=()=>openGal();
$('fExit').onclick=()=>{P.focus=false;saveP();applyFocus()};

function select(i){if(S.over)return;const again=S.sel===i&&!$('picker').hidden;S.sel=i;render();
  if(document.body.classList.contains('focus')){if(again)hidePicker();else showPicker(i)}}
function push(){S.hist.push({val:S.val.slice(),notes:S.notes.map(n=>n.slice())});if(S.hist.length>200)S.hist.shift()}
function pop(i){const el=board.childNodes[i];el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

function input(v){const i=S.sel;if(S.over||i<0||S.puz[i])return;if(S.val[i]===S.sol[i])return;
  push();
  if(S.noteMode){S.val[i]=0;const n=S.notes[i];const k=n.indexOf(v);k<0?n.push(v):n.splice(k,1)}
  else{if(S.val[i]===v){S.val[i]=0}else{S.val[i]=v;S.notes[i]=[];
      if(v!==S.sol[i]){S.mist++;if(S.mist>=3){S.over='lost'}}
      else{peersOf[i].forEach(p=>{const n=S.notes[p],k=n.indexOf(v);if(k>=0)n.splice(k,1)});pop(i);cheerTick();
        if(S.val.every((x,j)=>x===S.sol[j]))S.over='won'}}}
  render();save();if(S.over)endScreen()}
// Anfeuern nach ein paar richtigen Zahlen
let cheerLeft=4+Math.floor(Math.random()*3),cheerT,cheerLast=-1;
const CHEERS=['Du schaffst das Muttili! ♥','Go Wacki Go Wacki!','Ein rollender Stein setzt kein Moos an!','Sudoku hilft gegen Alzheimer!'];
function cheerTick(){if(!CHEERS.length||--cheerLeft>0)return;cheerLeft=5+Math.floor(Math.random()*4);
  if(S.val.every((x,j)=>x===S.sol[j]))return;let k;do{k=Math.floor(Math.random()*CHEERS.length)}while(k===cheerLast&&CHEERS.length>1);cheerLast=k;
  const c=$('cheer');c.textContent=CHEERS[k];
  c.classList.add('on');clearTimeout(cheerT);cheerT=setTimeout(()=>c.classList.remove('on'),2600)}
function erase(){const i=S.sel;if(S.over||i<0||S.puz[i]||S.val[i]===S.sol[i])return;push();S.val[i]=0;S.notes[i]=[];render();save()}
function undo(){if(S.over||!S.hist.length)return;const h=S.hist.pop();S.val=h.val;S.notes=h.notes;render();save()}
function hint(){if(S.over||!S.hints)return;let i=S.sel;
  if(i<0||S.val[i]===S.sol[i]){const open=[...Array(81).keys()].filter(j=>S.val[j]!==S.sol[j]);if(!open.length)return;i=open[Math.random()*open.length|0]}
  push();S.hints--;S.val[i]=S.sol[i];S.notes[i]=[];peersOf[i].forEach(p=>{const n=S.notes[p],k=n.indexOf(S.sol[i]);if(k>=0)n.splice(k,1)});
  S.sel=i;pop(i);if(S.val.every((x,j)=>x===S.sol[j]))S.over='won';render();save();if(S.over)endScreen()}

// ---------- Belohnungen ----------
const DL={leicht:'Leicht',mittel:'Mittel',schwer:'Schwer',experte:'Experte'};
const BASE={leicht:100,mittel:200,schwer:350,experte:500};
const FAST={leicht:300,mittel:600,schwer:900,experte:1200};
const RANKS=[['Schiffsjunge',0],['Leichtmatrose',500],['Matrose',1500],['Bootsmann',3500],['Steuermann',7000],['Erster Offizier',12000],['Kapitän',20000],['Kommodore',32000],['Admiral',50000]];
const IC={
  anchor:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13a7 7 0 0 0 14 0M8 10h8"/>',
  check:'<path d="M5 12.5 10 17 19 7"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  crown:'<path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5Z"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  flame:'<path d="M12 21c-3.9 0-6-2.6-6-5.6 0-3.4 3-5.4 3-9.4 2.5 1.5 4 3.5 4 6 1-.8 1.5-2 1.5-3 2 1.6 3.5 4 3.5 6.4 0 3-2.1 5.6-6 5.6Z"/>',
  wave:'<path d="M2 10c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3M2 16c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>'};
const BADGES=[
  {id:'erstes',ic:'anchor',t:'bronze',n:'Leinen los',d:'Erstes Rätsel gelöst'},
  {id:'fehlerfrei',ic:'check',t:'bronze',n:'Sauberer Kurs',d:'Ohne Fehler gelöst'},
  {id:'solo',ic:'compass',t:'bronze',n:'Ohne Lotsen',d:'Ohne Tipps gelöst'},
  {id:'zehn',tx:'10',t:'bronze',n:'Zehn Fahrten',d:'10 Rätsel gelöst'},
  {id:'schnell',ic:'clock',t:'silver',n:'Volle Fahrt',d:'Mittel in unter 8 Minuten'},
  {id:'alle',ic:'layers',t:'silver',n:'Alle Gewässer',d:'Jede Stufe einmal gelöst'},
  {id:'serie3',ic:'flame',t:'silver',n:'Drei Tage auf See',d:'3 Tage in Folge gelöst'},
  {id:'nacht',ic:'moon',t:'silver',n:'Nachtwache',d:'Zwischen 0 und 5 Uhr gelöst'},
  {id:'experte',ic:'crown',t:'gold',n:'Kapitänspatent',d:'Ein Experte-Rätsel gelöst'},
  {id:'perfekt',ic:'star',t:'gold',n:'Perfekte Überfahrt',d:'Schwer oder Experte ohne Fehler und Tipps'},
  {id:'serie7',ic:'wave',t:'gold',n:'Eine Woche auf See',d:'7 Tage in Folge gelöst'},
  {id:'fuenfzig',tx:'50',t:'gold',n:'Fünfzig Fahrten',d:'50 Rätsel gelöst'}];
const medal=(b,cls='')=>`<span class="medal t-${b.t} ${cls}">${b.tx?b.tx:`<svg viewBox="0 0 24 24">${IC[b.ic]}</svg>`}</span>`;
const nf=n=>Math.round(n).toLocaleString('de-DE');
const dk=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
function loadR(){let r=null;try{r=JSON.parse(localStorage.getItem('sudoku-rewards'))}catch(e){}
  r=Object.assign({pts:0,solved:0,byDiff:{},best:{},streak:0,bestStreak:0,lastDay:null,badges:{},log:[]},r||{});
  if(r.days==null)r.days=new Set(r.log.map(l=>l.day)).size;return r}
function saveR(R){try{localStorage.setItem('sudoku-rewards',JSON.stringify(R))}catch(e){}}
function rankOf(p){let i=0;RANKS.forEach((r,k)=>{if(p>=r[1])i=k});return i}
function curStreak(R){const t=dk(new Date()),y=dk(new Date(Date.now()-864e5));return R.lastDay===t||R.lastDay===y?R.streak:0}
function renderRank(){const R=loadR(),n=slotsOf(R);let q=null,prev,label,txt;
  if(n<MAXF){q=FRAMES[n];prev=FRAMES[n-1];label='Bilderrahmen '+n+' von '+MAXF;txt='Nächster: noch '+need(R,q,1)}
  else{const ti=TRACKS.findIndex(t=>!met(R,t));label='Alle '+MAXF+' Rahmen offen';
    if(ti<0)txt='Alles freigeschaltet';else{q=TRACKS[ti];prev=ti?TRACKS[ti-1]:FRAMES[MAXF-1];txt=q.n+': noch '+need(R,q,1)}}
  $('rName').textContent=label;$('rPts').textContent=txt;$('rBar').style.width=(q?prog(R,q,prev)*100:100)+'%';
  $('galBadge').textContent=Math.min(photos.length,n)+'/'+n}

function award(){const R=loadR(),oldSlots=slotsOf(R),oldTracks=TRACKS.filter(t=>met(R,t)).length,d=S.d,t=S.time,hintsUsed=3-S.hints,mist=S.mist,now=new Date();
  const b=BASE[d],lines=[[DL[d],b]];
  if(!mist)lines.push(['Ohne Fehler',b*.5]);
  if(!hintsUsed)lines.push(['Ohne Tipps',b*.25]);
  if(t<FAST[d])lines.push(['Unter '+FAST[d]/60+' Min.',b*.25]);
  const today=dk(now),yest=dk(new Date(now-864e5));
  if(R.lastDay!==today){R.streak=R.lastDay===yest?R.streak+1:1;R.lastDay=today;R.days++}
  R.bestStreak=Math.max(R.bestStreak,R.streak);

    alle:Object.keys(DL).every(k=>R.byDiff[k]),serie3:R.streak>=3,nacht:now.getHours()<5,experte:d==='experte',
    perfekt:(d==='schwer'||d==='experte')&&!mist&&!hintsUsed,serie7:R.streak>=7,fuenfzig:R.solved>=50};
  BADGES.forEach(x=>{if(chk[x.id]&&!has(x.id)){R.badges[x.id]=today;earn.push(x.id)}});

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da)}
function holidayFor(dt){const y=dt.getFullYear(),M=dt.getMonth()+1,D=dt.getDate(),day=new Date(y,M-1,D);
  const diff=(a)=>Math.round((day-a)/864e5);
  if((M===12&&D>=30)||(M===1&&D===1))return'silvester';
  if(M===12&&D<=26)return'weihnachten';
  if(M===2&&D>=12&&D<=14)return'valentin';
  if(M===10&&D>=29)return'halloween';
  if(M===11&&D===11)return'karneval';
  const e=diff(easter(y));if(e>=-52&&e<=-47)return'karneval';if(e>=-3&&e<=1)return'ostern';
  if(M===5){const first=new Date(y,4,1),sun=1+((7-first.getDay())%7)+7;if(D===sun||D===sun-1)return'muttertag'}
  return null}
function activeHol(){const v=P.hol||'auto';if(v==='off')return null;if(v!=='auto')return HOL[v]?v:null;return holidayFor(new Date())}
let hfxRaf=null;
function applyHol(){const id=activeHol(),w=document.querySelector('.board-wrap'),h=HOL[id];
  w.querySelectorAll('.hdeco,.hlabel').forEach(x=>x.remove());
  if(!h){w.removeAttribute('data-hol');w.style.removeProperty('--h1');w.style.removeProperty('--h2');stopHfx();return}
  w.setAttribute('data-hol',id);w.style.setProperty('--h1',h.c1);w.style.setProperty('--h2',h.c2);
  ['tl','tr','bl','br'].forEach((p,k)=>{const s=document.createElement('span');s.className='hdeco '+p;s.textContent=h.deco[k];s.setAttribute('aria-hidden','true');w.appendChild(s)});
  const l=document.createElement('span');l.className='hlabel';l.textContent=h.label;w.appendChild(l);
  startHfx(h)}
function stopHfx(){if(hfxRaf)cancelAnimationFrame(hfxRaf);hfxRaf=null;const c=$('hfx');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function startHfx(h){stopHfx();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('hfx'),ctx=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  const size=()=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr};size();addEventListener('resize',size);
  const cols={snow:['#ffffff'],spark:['#ffd76a','#fff3c4','#ffffff'],hearts:['#e0457b','#ff8fb1','#ffffff'],confetti:['#e63946','#2a9d8f','#f4d35e','#457b9d','#ff7aa8'],
    petals:['#ffc2d4','#ffe08a','#ffffff','#c7e8b0'],leaves:['#ff7518','#c2410c','#f59e0b','#7c3aed']}[h.fx];
  const N=h.fx==='spark'?45:34;
  const mk=(top)=>({x:Math.random()*c.width,y:top?-20*dpr:Math.random()*c.height,r:(h.fx==='snow'?1.5+Math.random()*2.5:3+Math.random()*4)*dpr,
    vy:(h.fx==='spark'?.15:.35+Math.random()*.6)*dpr,vx:(Math.random()-.5)*.4*dpr,a:Math.random()*6.28,va:(Math.random()-.5)*.05,
    c:cols[Math.random()*cols.length|0],t:Math.random()*6.28});
  const P_=[...Array(N)].map(()=>mk(false));
  (function tick(){if(document.hidden){hfxRaf=requestAnimationFrame(tick);return}
    ctx.clearRect(0,0,c.width,c.height);
    for(const p of P_){p.t+=.03;p.y+=p.vy;p.x+=p.vx+Math.sin(p.t)*.3*dpr;p.a+=p.va;
      if(p.y>c.height+20*dpr)Object.assign(p,mk(true));
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      if(h.fx==='snow'){ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(0,0,p.r,0,6.28);ctx.fill()}
      else if(h.fx==='spark'){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(p.t*2));ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?p.r*.35:p.r*1.3,an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}ctx.fill()}
      else if(h.fx==='hearts'){ctx.globalAlpha=.8;const s=p.r*.9;ctx.beginPath();ctx.moveTo(0,s*.6);ctx.bezierCurveTo(-s*1.6,-s*.4,-s*.5,-s*1.5,0,-s*.5);ctx.bezierCurveTo(s*.5,-s*1.5,s*1.6,-s*.4,0,s*.6);ctx.fill()}
      else if(h.fx==='confetti'){ctx.globalAlpha=.9;ctx.fillRect(-p.r,-p.r/2.5,p.r*2,p.r/1.25)}
      else{ctx.globalAlpha=.8;ctx.beginPath();ctx.ellipse(0,0,p.r*1.2,p.r*.55,0,0,6.28);ctx.fill()}
      ctx.restore()}
    hfxRaf=requestAnimationFrame(tick)})()}

(function(){if(!WACKI)return;const el=$('wacki');
  el.innerHTML=['look','tiltA','tiltB','away'].map(k=>`<img data-f="${k}" src="${WACKI['w_'+k]}" alt="">`).join('')+'<span class="wbub">Wuff!</span>';
  const frame=k=>el.querySelectorAll('img').forEach(i=>i.classList.toggle('on',i.dataset.f===k));
  let busy=false,timer;const later=(a,b)=>{clearTimeout(timer);timer=setTimeout(peek,(a+Math.random()*(b-a))*1000)};
  function peek(){const blocked=busy||S.over||document.hidden||!$('gal').hidden||!$('sheet').hidden||!$('overlay').hidden;
    if(blocked)return later(20,40);busy=true;el.classList.toggle('right',Math.random()<.5);frame('look');
    const seq=[[60,()=>el.classList.add('in')],[2100,()=>frame('tiltA')],[3000,()=>frame('look')],[3500,()=>frame('tiltB')],[4300,()=>frame('look')],
      [4900,()=>frame('away')],[5800,()=>el.classList.remove('in')],[6800,()=>{busy=false;later(90,240)}]];
    seq.forEach(([t,f])=>setTimeout(f,t))}
  el.addEventListener('click',()=>{const b=el.querySelector('.wbub');b.classList.add('on');setTimeout(()=>b.classList.remove('on'),1300)});
  later(25,60)})();

renderRank();applyHol();setInterval(()=>{if((P.hol||'auto')==='auto')applyHol()},36e5);
const saved=load();
if(saved&&saved.sol&&saved.val){S=saved;start();if(S.over)endScreen()}
else{newGame('mittel');S.sel=40;render()}
})();
